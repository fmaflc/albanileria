<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas visuales de albañilería</title>
<style>
:root { --page:#faf7f2; --card:#ffffff; --ink:#2b2620; --ink2:#6b6353; --line:#e8e0d2; --accent:#6b4f1d; --warn-bg:#fdf3e3; --warn-line:#d99a2b; --note-bg:#eef5ee; --note-line:#7ba05b; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--page); color: var(--ink); font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 16px; line-height: 1.55; }
.wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
.cab { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.cab { flex-direction: column; align-items: flex-start; gap: 10px; }
.cab img { width: 105px; height: auto; max-width: 40%; }
.home .cab img { width: 250px; max-width: 80%; }
.cab h1 { font-size: 24px; margin: 0; line-height: 1.2; }
.fact { color: var(--ink2); font-size: 13px; margin-top: 2px; }
.intro { color: var(--ink2); margin: 10px 0 18px; }
.callout { border-radius: 12px; padding: 12px 16px; margin: 14px 0; font-size: 14.5px; }
.callout b { display: block; margin-bottom: 2px; }
.note { background: var(--note-bg); border: 2px solid var(--note-line); }
.warn { background: var(--warn-bg); border: 2px solid var(--warn-line); }
.seccion { margin-top: 22px; }
.seccion > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); margin: 0 0 10px; font-weight: 600; }
.datos { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.datos div { display: flex; gap: 10px; padding: 4px 0; }
.datos b { flex: none; min-width: 110px; color: var(--accent); font-size: 14px; }
input[type=search] { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
.niveles { display: flex; gap: 8px; margin-top: 10px; }
.niveles button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink2); font-size: 14.5px; cursor: pointer; }
.niveles button.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.ficha-card { display: block; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
.ficha-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.ficha-card-body { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px 16px; }
.ficha-num { flex: none; font-weight: 700; color: var(--accent); font-size: 18px; }
.ficha-title { font-weight: 600; font-size: 16.5px; }
.ficha-meta { margin-top: 2px; color: var(--ink2); font-size: 12.5px; }
.vacio { color: var(--ink2); font-size: 14.5px; padding: 8px 2px; }
.paso { margin-bottom: 26px; }
.paso img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; border-radius: 16px; border: 1px solid var(--line); }
.paso-pie { display: flex; gap: 12px; align-items: baseline; margin: 12px 0 10px; }
.paso-num { flex: none; font-weight: 700; color: var(--accent); }
.paso-pie p { margin: 0; }
.btn-hecho { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink2); font-size: 14.5px; cursor: pointer; }
.btn-hecho.sel { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.caption { color: var(--ink2); font-size: 12.5px; margin-top: 8px; }
.volver { display: inline-block; margin-top: 10px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none; font-size: 14.5px; }
.pie { margin-top: 30px; color: var(--ink2); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }

.visual { display: block; position: relative; overflow: hidden; }
.con-marca::after { content: ''; position: absolute; left: 2.5%; bottom: 3%; width: 8.5%; max-width: 102px; aspect-ratio: 82 / 83; background: url('img/marca.png') center / contain no-repeat; pointer-events: none; }
.callout a { color: var(--accent); }
@media (max-width: 380px) { .datos div { flex-direction: column; gap: 0; } }
fieldset{border:0;padding:0;margin:22px 0}legend{font-weight:600;font-size:18px;margin-bottom:12px}.opcion{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;cursor:pointer}.opcion input{margin-top:6px;accent-color:var(--accent);flex:none}.principal{background:var(--accent);color:white}.ej-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;text-decoration:none;color:var(--ink)}.ej-card .ya{flex:none}.ej-nav{display:flex;justify-content:space-between;gap:12px}.practica p,.datos p{margin:6px 0}progress{width:100%;accent-color:var(--accent)}button,a,input{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9b6d1c;outline-offset:3px}.volver{max-width:100%}

.big img{display:block;width:100%;border-radius:16px;border:1px solid var(--line)}.ej-card .ya{color:#4d7a2e;font-size:13px}.ej-card{flex-wrap:wrap}

</style>
</head>

const state = { vista: 'home', ficha: null, buscar: '', nivel: 'todos', hechos: {} };
const app = document.getElementById('app');

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

function irFicha(slug) { state.vista = 'ficha'; state.ficha = slug; window.scrollTo(0, 0); location.hash = '/ficha/' + slug; render(); }
function irHome() { state.vista = 'home'; state.ficha = null; location.hash = '/'; render(); }

window.addEventListener('hashchange', () => {
  const em=location.hash.match(/^#\/ejercicios(?:\/([a-z0-9_]+))?$/);
  if(em&&(!em[1]||EJERCICIOS.some(e=>e.slug===em[1]))){state.vista=em[1]?'ejercicio':'ejercicios';state.slug=em[1]||null;window.scrollTo(0,0);render();return;}
  const m = location.hash.match(/#\/ficha\/([a-z]+)/);
  if (m && FICHAS.some(f => f.slug === m[1])) { state.vista = 'ficha'; state.ficha = m[1]; } else { state.vista = 'home'; state.ficha = null; }
  render();
});

function headerHtml(titulo, fact, intro) {
  return '<div class="cab"><img src="img/logo.png" alt="Logotipo de la Fundación Laboral de la Construcción Castilla-La Mancha"><div><h1>' + esc(titulo) + '</h1><div class="fact">' + esc(fact) + '</div></div></div>'
    + '<p class="intro">' + esc(intro) + '</p>';
}

function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function renderHome() {
  const q = norm(state.buscar.trim());
  const vis = FICHAS.filter(f => (state.nivel === 'todos' || f.nivel.toLowerCase() === state.nivel) &&
    (!q || q.split(/\s+/).every(w => norm(f.title + ' ' + f.materiales + ' ' + f.herramientas + ' ' + f.keywords).includes(w))));
  let h = headerHtml('Fichas visuales de albañilería', FICHAS.length + ' fichas', 'Tareas paso a paso con imágenes grandes y muy poco texto, para consultar desde el móvil en el taller.');
  h += '<div class="callout note"><b>Para la práctica</b>Empieza repasando <a href="#/ficha/seguridad">Seguridad antes de empezar</a>. Elige la tarea y revisa el resultado con tu docente.</div>';
  h += '<div class="seccion"><h2>Buscar y filtrar</h2>'
    + '<input type="search" id="buscar" placeholder="Buscar" value="' + esc(state.buscar) + '" aria-label="Buscar">'
    + '<div class="niveles">'
    + ['todos','inicial','intermedio'].map(n => '<button data-nivel="' + n + '" aria-pressed="' + (state.nivel === n) + '" class="' + (state.nivel === n ? 'sel' : '') + '">' + (n === 'todos' ? 'Todos' : n[0].toUpperCase() + n.slice(1)) + '</button>').join('')
    + '</div></div>';
  h += '<div class="seccion"><h2>Las fichas · ' + vis.length + (vis.length === 1 ? ' resultado' : ' resultados') + '</h2><div id="lista">';
  h += vis.map(f => '<a class="ficha-card" href="#/ficha/' + f.slug + '"><span class="visual' + (f.pasos[0].marca ? ' con-marca' : '') + '"><img src="' + f.pasos[0].img + '" alt="' + esc(f.pasos[0].alt) + '" loading="lazy" decoding="async"></span><div class="ficha-card-body"><span class="ficha-num">' + f.number + '</span><div><div class="ficha-title">' + esc(f.title) + '</div><div class="ficha-meta">' + esc(f.nivel) + ' · ' + f.pasos.length + ' pasos</div></div></div></a>').join('');
  if (vis.length === 0) h += '<div class="vacio">No hay ninguna ficha que coincida con la búsqueda.</div>';
  h += '</div></div>';
  h += '<div class="pie">Los pasos marcados duran mientras la página está abierta en este dispositivo. Funciona con conexión; el uso sin conexión es una propuesta pendiente.</div>';
  app.className = 'wrap home'; app.innerHTML = h;
  document.title = 'Fichas visuales de albañilería';
  const inp = document.getElementById('buscar');
  inp.addEventListener('input', () => { state.buscar = inp.value; const pos = inp.selectionStart; render(); const i2 = document.getElementById('buscar'); i2.focus(); i2.setSelectionRange(pos, pos); });
  document.querySelectorAll('.niveles button').forEach(b => b.addEventListener('click', () => { state.nivel = b.dataset.nivel; render(); }));
  document.querySelectorAll('.ficha-card').forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); irFicha(a.getAttribute('href').split('/').pop()); }));
}

function renderFicha() {
  const f = FICHAS.find(x => x.slug === state.ficha);
  if (!f) { irHome(); return; }
  if (!state.hechos[f.slug]) state.hechos[f.slug] = [];
  const hechos = state.hechos[f.slug];
  let h = headerHtml(f.title, f.nivel, f.resumen);
  h += '<div class="callout warn"><b>Antes de empezar: seguridad</b>' + esc(f.seguridad) + '</div>';
  h += '<div class="seccion"><h2>Materiales y herramientas</h2><div class="datos"><div><b>Materiales</b><span>' + esc(f.materiales) + '</span></div><div><b>Herramientas</b><span>' + esc(f.herramientas) + '</span></div></div></div>';
  h += '<div class="seccion"><h2>Pasos</h2>';
  f.pasos.forEach((p, i) => {
    const hecho = hechos.includes(i);
    h += '<div class="paso"><div class="visual' + (p.marca ? ' con-marca' : '') + '"><img src="' + p.img + '" alt="' + esc(p.alt) + '" loading="lazy" decoding="async"></div><div class="paso-pie"><span class="paso-num">' + (i + 1) + '</span><p>' + esc(p.texto) + '</p></div>'
      + '<button class="btn-hecho' + (hecho ? ' sel' : '') + '" data-paso="' + i + '" aria-pressed="' + hecho + '">' + (hecho ? 'Hecho' : 'Marcar como hecho') + '</button>'
      + (i === 0 ? '<div class="caption">El marcado es una ayuda temporal: dura mientras la página está abierta.</div>' : '')
      + '</div>';
  });
  if (f.comprobacion) h += '<div class="callout note"><b>Comprobación final</b>' + esc(f.comprobacion) + '</div>';
  if (f.fuentes && f.fuentes.length) h += '<details class="caption"><summary>Referencias para el docente</summary><ul>' + f.fuentes.map(a => '<li><a href="' + esc(a[1]) + '" target="_blank" rel="noopener">' + esc(a[0]) + '</a></li>').join('') + '</ul></details>';
  h += '<div class="caption">Ilustraciones creadas para esta ficha; no son fotografías de una obra real.</div></div>';
  h += '<a class="volver" href="#/">Volver a las fichas</a>';
  h += '<div class="pie">Los pasos marcados duran mientras la página está abierta en este dispositivo.</div>';
  app.className = 'wrap'; app.innerHTML = h;
  document.title = f.number + '. ' + f.title + ' - Fichas visuales de albañilería';
  document.querySelectorAll('.btn-hecho').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.dataset.paso, 10);
    const arr = state.hechos[f.slug];
    const k = arr.indexOf(i);
    if (k >= 0) arr.splice(k, 1); else arr.push(i);
    render();
  }));
  document.querySelector('.volver').addEventListener('click', ev => { ev.preventDefault(); irHome(); });
}

function render() { if (state.vista === 'ficha') renderFicha(); else renderHome(); }
const m0 = location.hash.match(/#\/ficha\/([a-z]+)/);
if (m0 && FICHAS.some(f => f.slug === m0[1])) { state.vista = 'ficha'; state.ficha = m0[1]; }
</script>
<script src="ejercicios.js"></script>
</body>
</html>
